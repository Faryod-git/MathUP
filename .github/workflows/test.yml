name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Verify Windows updater with synthetic private content
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/windows-update.ps1
